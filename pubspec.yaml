name: higo_countrycode
description: Local HiGO screens and package-based country phone picker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  country_picker: ^2.0.28
  phone_numbers_parser: ^9.0.28
  cupertino_icons: ^2.0.0
  google_maps_flutter: ^2.18.1
  pointer_interceptor: ^0.10.1+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
